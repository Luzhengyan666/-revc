name: reVC Android

on:
  push:
    branches: [ "miami" ]
    paths:
      - 'android/launcher/**'
      - 'src/**'
  pull_request:
    branches: [ "miami" ]
    paths:
      - 'android/launcher/**'
      - 'src/**'
  release:
    types: published

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    defaults:
      run:
        working-directory: android/launcher

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodules are present
        run: |
          echo "=== 检查子模块 ==="
          git submodule status
          echo "=== 检查 SDL 目录是否存在 ==="
          ls -la ../../vendor 2>/dev/null || echo "vendor 目录不存在"
          ls -la ../../vendor/sdl 2>/dev/null || echo "vendor/sdl 不存在"
        working-directory: .

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Declare build version
        id: vars
        shell: bash
        run: |
          echo "build_version=$(git describe --always --tags --dirty)" >> $GITHUB_OUTPUT

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean build (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew clean

      - name: Set assemble task name
        run: echo "ASSEMBLE_TASK=assemble${{ matrix.variant == 'debug' && 'Debug' || 'Release' }}" >> $GITHUB_ENV

      - name: Build ${{ matrix.variant }} APK
        run: ./gradlew $ASSEMBLE_TASK --no-daemon --stacktrace

      - name: Verify APK contents (检查 .so 库)
        run: |
          APK_PATH="app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk"
          echo "=== APK 路径: $APK_PATH ==="
          if [ -f "$APK_PATH" ]; then
            echo "=== APK 内的 .so 文件 ==="
            unzip -l "$APK_PATH" | grep '\.so' || echo "APK 里没有任何 .so 文件！"
          else
            echo "APK 没有生成！"
            exit 1
          fi

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: revc-${{ matrix.variant }}
          path: android/launcher/app/build/outputs/apk/${{ matrix.variant }}/
          if-no-files-found: error
